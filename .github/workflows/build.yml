name: Build & Release J.A.R.V.I.S.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  QT_VERSION: '6.9.3'
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtmultimedia qtwebengine qtwebsockets qtnetworkauth qtimageformats'
          cache: true

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      # === Вшиваем API-ключ из GitHub Secrets ===
      - name: Inject API key
        if: env.ANTHROPIC_API_KEY != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          $key = $env:ANTHROPIC_API_KEY
          $xorKey = @(0x4A, 0x41, 0x52, 0x56, 0x49, 0x53, 0xDE, 0xAD, 0xBE, 0xEF, 0xCA, 0xFE, 0x13, 0x37, 0x42, 0x69)
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($key)
          $encrypted = @()
          for ($i = 0; $i -lt $bytes.Length; $i++) {
              $encrypted += ($bytes[$i] -bxor $xorKey[$i % $xorKey.Length])
          }
          
          $lines = @()
          for ($i = 0; $i -lt $encrypted.Length; $i += 12) {
              $end = [Math]::Min($i + 11, $encrypted.Length - 1)
              $chunk = $encrypted[$i..$end]
              $hexChunk = ($chunk | ForEach-Object { '0x{0:X2}' -f $_ }) -join ', '
              $lines += "    $hexChunk,"
          }
          $arrayBody = $lines -join "`n"
          
          $header = @"
          #pragma once
          #include <QString>
          #include <QByteArray>
          
          namespace EmbeddedKey {
          
          static constexpr uint8_t XOR_KEY[] = {
              0x4A, 0x41, 0x52, 0x56, 0x49, 0x53, 0xDE, 0xAD, 0xBE, 0xEF, 0xCA, 0xFE, 0x13, 0x37, 0x42, 0x69
          };
          static constexpr int XOR_KEY_LEN = sizeof(XOR_KEY);
          
          static constexpr uint8_t ENCRYPTED_KEY_DATA[] = {
          $arrayBody
          };
          static constexpr int ENCRYPTED_KEY_SIZE = $($encrypted.Length);
          
          inline QByteArray xorDecrypt(const uint8_t* data, int size) {
              QByteArray result(size, '\0');
              for (int i = 0; i < size; ++i) {
                  result[i] = static_cast<char>(data[i] ^ XOR_KEY[i % XOR_KEY_LEN]);
              }
              return result;
          }
          
          inline QString decryptApiKey() {
              if (ENCRYPTED_KEY_SIZE == 0) return QString();
              QByteArray decrypted = xorDecrypt(ENCRYPTED_KEY_DATA, ENCRYPTED_KEY_SIZE);
              return QString::fromUtf8(decrypted);
          }
          
          inline bool hasEmbeddedKey() { return ENCRYPTED_KEY_SIZE > 0; }
          
          }
          "@
          
          Set-Content -Path "src/llm/embedded_key.h" -Value $header -Encoding UTF8
          Write-Host "API key injected ($($encrypted.Length) bytes encrypted)"
        shell: pwsh

      # === Версия из git-тега → CMakeLists.txt ===
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $content = Get-Content CMakeLists.txt -Raw
          $content = $content -replace 'project\(jarvis VERSION [0-9]+\.[0-9]+\.[0-9]+', "project(jarvis VERSION $version"
          Set-Content CMakeLists.txt $content
          Write-Host "CMake version set to $version"
        shell: pwsh

      # === Определяем путь к Qt и проверяем что он есть ===
      - name: Resolve Qt path
        id: qtpath
        shell: pwsh
        run: |
          # install-qt-action@v4 экспортирует QT_ROOT_DIR — это и есть нужный путь
          $qt = $env:QT_ROOT_DIR
          if (-not $qt -or -not (Test-Path $qt)) {
              # Запасной вариант — Qt6_DIR (старое имя)
              $qt = $env:Qt6_DIR
          }
          if (-not $qt -or -not (Test-Path $qt)) {
              Write-Error "Qt path not found. QT_ROOT_DIR='$env:QT_ROOT_DIR', Qt6_DIR='$env:Qt6_DIR'"
              exit 1
          }
          Write-Host "Qt path: $qt"
          "qt_path=$qt" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # === Whisper.cpp для голосового ввода ===
      - name: Clone whisper.cpp
        run: |
          git clone --depth=1 https://github.com/ggerganov/whisper.cpp redist/whisper
        shell: cmd

      # === Vosk SDK — DLL для офлайн распознавания ===
      - name: Download Vosk SDK
        shell: pwsh
        run: |
          $voskUrl = "https://github.com/alphacep/vosk-api/releases/download/v0.3.45/vosk-win64-0.3.45.zip"
          $zipPath = "$env:TEMP\vosk-sdk.zip"
          $extractDir = "$env:TEMP\vosk-extract"
          $targetDir = "redist\vosk"
          
          Write-Host "Downloading Vosk SDK..."
          Invoke-WebRequest -Uri $voskUrl -OutFile $zipPath -UseBasicParsing
          
          Write-Host "Extracting Vosk SDK..."
          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
          
          # Копируем DLL и заголовки в redist/vosk/
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          $srcDir = "$extractDir\vosk-win64-0.3.45"
          Copy-Item "$srcDir\libvosk.dll"          "$targetDir\" -Force
          Copy-Item "$srcDir\libgcc_s_seh-1.dll"   "$targetDir\" -Force
          Copy-Item "$srcDir\libstdc++-6.dll"      "$targetDir\" -Force
          Copy-Item "$srcDir\libwinpthread-1.dll"   "$targetDir\" -Force
          Copy-Item "$srcDir\vosk_api.h"           "$targetDir\" -Force -ErrorAction SilentlyContinue
          
          # Чистим
          Remove-Item $zipPath -Force
          Remove-Item $extractDir -Recurse -Force
          
          Write-Host "Vosk SDK installed to $targetDir"
          Get-ChildItem $targetDir | ForEach-Object { Write-Host "  $($_.Name) ($([math]::Round($_.Length/1MB, 1)) MB)" }

      # === Сборка ===
      - name: Configure CMake
        shell: pwsh
        run: |
          $qt = "${{ steps.qtpath.outputs.qt_path }}"
          Write-Host "Using Qt prefix: $qt"
          cmake -S . -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$qt"

      - name: Build Release
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      # === Подготовка пакета ===
      - name: Prepare release package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_package | Out-Null
          New-Item -ItemType Directory -Force -Path release_package\plugins | Out-Null
          
          # На VS-генераторе бинарь оказывается в build/bin/Release/, на ninja — в build/bin/
          $exePath = "build\bin\Release\jarvis.exe"
          if (-not (Test-Path $exePath)) { $exePath = "build\bin\jarvis.exe" }
          if (-not (Test-Path $exePath)) {
            $found = Get-ChildItem -Path build -Recurse -Filter "jarvis.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $exePath = $found.FullName }
          }
          if (-not (Test-Path $exePath)) {
            Write-Error "jarvis.exe not found in build directory!"
            Get-ChildItem -Path build -Recurse | Select-Object -ExpandProperty FullName
            exit 1
          }
          
          Write-Host "Using exe: $exePath"
          Copy-Item $exePath release_package\
          
          if (Test-Path "plugins\plugins.json") {
            Copy-Item plugins\plugins.json release_package\plugins\
          }
          
          Get-ChildItem -Path build -Recurse -Filter "JarvisPlugin_*.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName release_package\plugins\ }
          
          $qt = "${{ steps.qtpath.outputs.qt_path }}"
          & "$qt\bin\windeployqt.exe" `
            --release `
            --no-translations `
            --no-opengl-sw `
            --no-system-d3d-compiler `
            --no-compiler-runtime `
            release_package\jarvis.exe

          # Копируем Qt Multimedia плагины вручную если windeployqt не взял
          $mmSrc = "$qt\plugins\multimedia"
          if (Test-Path $mmSrc) {
            Copy-Item -Recurse -Force $mmSrc release_package\multimedia
            Write-Host "Qt Multimedia plugins copied"
          }
          $audioSrc = "$qt\plugins\audio"
          if (Test-Path $audioSrc) {
            Copy-Item -Recurse -Force $audioSrc release_package\audio
            Write-Host "Qt Audio plugins copied"
          }

          # Явно копируем sqldrivers — windeployqt иногда их пропускает,
          # если линковщик не видит явного использования QSql в main.cpp,
          # но они нужны для DatabaseManager (QSQLITE плагин = jarvis.db).
          # Без qsqlite.dll БД не открывается, все счётчики Training = 0.
          $sqlSrc = "$qt\plugins\sqldrivers"
          if (Test-Path $sqlSrc) {
            New-Item -ItemType Directory -Force -Path "release_package\sqldrivers" | Out-Null
            Copy-Item -Force "$sqlSrc\qsqlite.dll" "release_package\sqldrivers\" -ErrorAction SilentlyContinue
            Write-Host "sqldrivers\qsqlite.dll copied"
          } else {
            Write-Warning "MISSING sqldrivers at: $sqlSrc"
          }
          # Проверяем что qsqlite реально попал (критичная зависимость)
          if (-not (Test-Path "release_package\sqldrivers\qsqlite.dll")) {
            Write-Error "CRITICAL: qsqlite.dll missing from release package — database will not work!"
          }

          # Копируем документацию в пакет
          $docs = @("PRIVACY_POLICY.txt", "JARVIS_INSTALL_NOTES.txt", "EULA_JARVIS.txt", "JARVIS_EULA_EN.txt", "README.md")
          foreach ($doc in $docs) {
            if (Test-Path $doc) {
              Copy-Item -Force $doc release_package\
              Write-Host "Copied doc: $doc"
            }
          }

          # Копируем Vosk DLL в release_package
          $voskDir = "redist\vosk"
          $voskDlls = @("libvosk.dll", "libgcc_s_seh-1.dll", "libstdc++-6.dll", "libwinpthread-1.dll")
          $voskMissing = @()
          foreach ($dll in $voskDlls) {
            $src = "$voskDir\$dll"
            if (Test-Path $src) {
              Copy-Item -Force $src release_package\
              Write-Host "Copied Vosk DLL: $dll"
            } else {
              Write-Warning "MISSING Vosk DLL: $src"
              $voskMissing += $dll
            }
          }
          if ($voskMissing.Count -gt 0) {
            Write-Error "Missing Vosk DLLs: $($voskMissing -join ', '). Voice input will not work!"
          } else {
            Write-Host "All Vosk DLLs copied successfully"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows-x64
          path: release_package/

      # ============================================================
      # Релиз — только при теге v*
      # ============================================================

      - name: Create ZIP archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: 7z a JARVIS-${{ github.ref_name }}-win64.zip ./release_package/*
        shell: cmd

      - name: Install Inno Setup
        if: startsWith(github.ref, 'refs/tags/v')
        run: choco install innosetup -y --no-progress
        shell: cmd

      - name: Update installer version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $content = Get-Content installer.iss -Raw
          $content = $content -replace '#define MyAppVersion "[0-9]+\.[0-9]+\.[0-9]+"', "#define MyAppVersion `"$version`""
          $content = $content -replace '#define MyAppBuildDir "build\\release_package"', '#define MyAppBuildDir "release_package"'
          Set-Content installer.iss $content
        shell: pwsh

      - name: Build installer
        if: startsWith(github.ref, 'refs/tags/v')
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
        shell: cmd
        continue-on-error: true

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            JARVIS-${{ github.ref_name }}-win64.zip
            build/installer/JARVIS-Setup-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
